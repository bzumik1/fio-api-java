name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    name: Build and test on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -PtestJdk=${{ matrix.java }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-java-${{ matrix.java }}
          path: build/reports
